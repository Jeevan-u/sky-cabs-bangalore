name = "sri-sadhguru-travels"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
# Execute schema with: npx wrangler d1 execute sadhguru-db --file=./src/lib/db/schema.sql
[[d1_databases]]
binding = "DB"
database_name = "sadhguru-db"
database_id = "your-d1-database-id-here"

[vars]
NEXTAUTH_URL = "https://www.srisadhgurutoursandtravels.com"
NEXTAUTH_SECRET = "production-sadhguru-travels-secret-key-2026"
OPENROUTER_MODEL = "google/gemini-2.5-flash"
